# TADIXS fork only: builds the Swift bindings from this branch and publishes
# them as a Swift package that TADIXS can depend on.
#
# - The framework (Apple Silicon macOS only) goes into a release of this
#   repository, as a zip.
# - The generated Swift sources and a Package.swift pointing at that zip go
#   onto the branch `swift-package`, which holds nothing else.
#
# TADIXS's project.yml then names this repository and the commit on
# `swift-package` printed at the end of the run.
name: TADIXS Swift package

on:
  push:
    branches: [tadixs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tadixs-swift-package
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin

      - name: Build the framework
        run: |
          unset SDKROOT
          cargo xtask swift build-framework --release --target aarch64-apple-darwin

      - name: Pack it
        id: pack
        working-directory: bindings/apple/generated
        run: |
          ditto -c -k --sequesterRsrc --keepParent MatrixSDKFFI.xcframework MatrixSDKFFI.xcframework.zip
          echo "checksum=$(swift package compute-checksum MatrixSDKFFI.xcframework.zip)" >> "$GITHUB_OUTPUT"
          echo "tag=tadixs-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Release the framework
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pack.outputs.tag }}
        run: |
          gh release create "$TAG" bindings/apple/generated/MatrixSDKFFI.xcframework.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "TADIXS bindings $TAG" \
            --notes "Swift bindings built from branch tadixs at $GITHUB_SHA: upstream main plus per-device trust. Apple Silicon macOS only. Not an upstream release."

      - name: Publish the Swift package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pack.outputs.tag }}
          CHECKSUM: ${{ steps.pack.outputs.checksum }}
        run: |
          package="$RUNNER_TEMP/swift-package"
          mkdir -p "$package/Sources/MatrixRustSDK"
          cp bindings/apple/generated/swift/*.swift "$package/Sources/MatrixRustSDK/"
          cp LICENSE "$package/LICENSE"
          cat > "$package/Package.swift" <<PACKAGE
          // swift-tools-version:5.7
          // TADIXS's build of the Matrix Rust SDK's Swift bindings: upstream main
          // plus per-device trust. Generated by the workflow "TADIXS Swift package"
          // from $GITHUB_SHA; do not edit.
          import PackageDescription
          let package = Package(
              name: "MatrixRustSDK",
              platforms: [.macOS(.v12)],
              products: [
                  .library(name: "MatrixRustSDK", targets: ["MatrixRustSDK"]),
              ],
              targets: [
                  .binaryTarget(
                      name: "MatrixSDKFFI",
                      url: "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/MatrixSDKFFI.xcframework.zip",
                      checksum: "$CHECKSUM"
                  ),
                  .target(name: "MatrixRustSDK", dependencies: [.target(name: "MatrixSDKFFI")])
              ]
          )
          PACKAGE
          sed -i '' 's/^          //' "$package/Package.swift"
          cd "$package"
          git init -q -b swift-package
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Swift package for $TAG (bindings from $GITHUB_SHA)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" swift-package
          revision="$(git rev-parse HEAD)"
          {
            echo "### Published"
            echo "- Release: \`$TAG\`"
            echo "- Swift package: branch \`swift-package\`, revision \`$revision\`"
          } >> "$GITHUB_STEP_SUMMARY"
